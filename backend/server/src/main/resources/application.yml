spring:
  application:
    name: queueflux-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/queueflux}
    username: ${DB_USERNAME:queueflux}
    password: ${DB_PASSWORD:queueflux-dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  sql:
    init:
      mode: always
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
