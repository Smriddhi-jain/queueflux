version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: maven
    directories:
      - /
      - /backend/queue-model
      - /backend/simulation-engine
      - /backend/simulation-profiles
      - /backend/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
